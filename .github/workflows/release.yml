name: Release

# Push a tag vX.Y.Z (matching ahelperw_fishing.__version__) to publish a GitHub release with
# the installer, the portable zip, SHA-256 checksums and build provenance attestations.
#
# Optional code signing (removes the "unknown publisher" warning once the certificate has
# reputation): add repository secrets SIGN_PFX_BASE64 (base64 of a .pfx code-signing
# certificate) and SIGN_PFX_PASSWORD. Without them the release is built unsigned.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Tag matches package version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/ahelperw_fishing/__init__.py -Pattern "__version__ = '(.+)'").Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != package version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare code signing (optional)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { Write-Host 'No signing certificate configured: building unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $command = "`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p $env:SIGN_PFX_PASSWORD `$f"
          "AHWF_SIGN_COMMAND=$command" >> $env:GITHUB_ENV

      - run: uv sync --locked --group build
      - run: uv run --no-sync python tools/build.py

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/AHelperWFishing-Setup-*.exe
            dist/AHelperWFishing-*-portable.zip

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $notes = [regex]::Match($text, $pattern).Groups[1].Value.Trim()
          if (-not $notes) { throw "CHANGELOG.md has no section for $env:VERSION" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" --title "AHelperW Fishing $env:VERSION" --notes-file release-notes.md
          "dist/AHelperWFishing-Setup-$env:VERSION.exe" "dist/AHelperWFishing-$env:VERSION-portable.zip" dist/SHA256SUMS.txt
